[project]
name = "hubops"
version = "0.1.0"
description = "DFW Hub Performance Analytics: BTS/weather/TSA/CBP wrangling and analysis notebooks that back a Fabric medallion lakehouse"
authors = [
    { name = "Medhansh Rajdeo", email = "medhansh.rajdeo@tamu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "timezonefinder>=6.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pandas>=2.2",
    "pypdf>=6.21.4",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
